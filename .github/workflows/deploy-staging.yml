name: Deploy Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      STAGING_ALIAS: jastipin-cms-staging.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.40.7
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test
      - name: Link staging database
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Review pending migrations
        run: supabase db push --dry-run --linked --password "$SUPABASE_DB_PASSWORD"
      - name: Apply staging migrations
        run: supabase db push --linked --password "$SUPABASE_DB_PASSWORD"
      - name: Pull staging project settings
        run: pnpm dlx vercel@59.1.3 pull --yes --environment=preview --token="$VERCEL_TOKEN"
      - name: Build staging
        run: pnpm dlx vercel@59.1.3 build --token="$VERCEL_TOKEN"
      - name: Deploy and assign stable staging URL
        run: |
          deployment_json="$(pnpm dlx vercel@59.1.3 deploy --prebuilt --json --token="$VERCEL_TOKEN")"
          deployment_url="$(printf '%s' "$deployment_json" | jq -r '.url // .deployment.url')"
          test -n "$deployment_url"
          pnpm dlx vercel@59.1.3 alias set "$deployment_url" "$STAGING_ALIAS" --token="$VERCEL_TOKEN"
      - name: Smoke test
        run: |
          login_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --retry 5 --retry-delay 3 "https://$STAGING_ALIAS/login")"
          auth_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --retry 5 --retry-delay 3 "https://$STAGING_ALIAS/api/v1/auth/me")"
          test "$login_status" = "200"
          test "$auth_status" = "401"
