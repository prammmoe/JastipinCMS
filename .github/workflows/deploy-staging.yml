name: Deploy Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
      APP_URL: ${{ secrets.APP_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: prammmoes-projects
      STAGING_ALIAS: jastipin-cms-staging.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test
      - name: Apply staging migrations
        run: pnpm db:migrate:staging
      - name: Verify Vercel project access
        run: |
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID")"
          if [ "$status" != "200" ]; then
            echo "Vercel project access failed with HTTP $status. Check VERCEL_TOKEN scope, VERCEL_ORG_ID, and VERCEL_PROJECT_ID."
            exit 1
          fi
      - name: Configure staging Vercel project link
        run: |
          mkdir -p .vercel
          jq -n \
            --arg orgId "$VERCEL_ORG_ID" \
            --arg projectId "$VERCEL_PROJECT_ID" \
            '{orgId: $orgId, projectId: $projectId}' \
            > .vercel/project.json
      - name: Sync staging runtime secrets to Vercel Preview
        run: |
          sync_secret() {
            local name="$1"
            local value="$2"
            pnpm dlx vercel@59.1.3 env rm "$name" preview --yes --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN" || true
            printf '%s' "$value" | pnpm dlx vercel@59.1.3 env add "$name" preview --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"
          }
          sync_secret APP_URL "$APP_URL"
          sync_secret CLOUDFLARE_ACCOUNT_ID "$CLOUDFLARE_ACCOUNT_ID"
          sync_secret CLOUDFLARE_D1_DATABASE_ID "$CLOUDFLARE_D1_DATABASE_ID"
          sync_secret CLOUDFLARE_D1_API_TOKEN "$CLOUDFLARE_D1_API_TOKEN"
      - name: Pull staging project settings
        run: pnpm dlx vercel@59.1.3 pull --yes --environment=preview --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"
      - name: Build staging
        run: pnpm dlx vercel@59.1.3 build --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"
      - name: Deploy and assign stable staging URL
        run: |
          deployment_json="$(pnpm dlx vercel@59.1.3 deploy --prebuilt --json --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN")"
          deployment_url="$(printf '%s' "$deployment_json" | jq -r '.url // .deployment.url')"
          test -n "$deployment_url"
          pnpm dlx vercel@59.1.3 alias set "$deployment_url" "$STAGING_ALIAS" --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"
      - name: Smoke test
        run: |
          login_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --retry 5 --retry-delay 3 "https://$STAGING_ALIAS/login")"
          auth_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --retry 5 --retry-delay 3 "https://$STAGING_ALIAS/api/v1/auth/me")"
          test "$login_status" = "200"
          test "$auth_status" = "401"
