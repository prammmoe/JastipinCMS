name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.40.7
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test
      - name: Link production database
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Review pending migrations
        run: supabase db push --dry-run --linked --password "$SUPABASE_DB_PASSWORD"
      - name: Apply production migrations
        run: supabase db push --linked --password "$SUPABASE_DB_PASSWORD"
      - name: Verify Vercel project access
        run: |
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID")"
          if [ "$status" != "200" ]; then
            echo "Vercel project access failed with HTTP $status. Check VERCEL_TOKEN scope, VERCEL_ORG_ID, and VERCEL_PROJECT_ID."
            exit 1
          fi
      - name: Link production Vercel project
        run: pnpm dlx vercel@59.1.3 link --yes --team="$VERCEL_ORG_ID" --project="$VERCEL_PROJECT_ID" --token="$VERCEL_TOKEN"
      - name: Pull production project settings
        run: pnpm dlx vercel@59.1.3 pull --yes --environment=production --project="$VERCEL_PROJECT_ID" --token="$VERCEL_TOKEN"
      - name: Build production
        run: pnpm dlx vercel@59.1.3 build --prod --token="$VERCEL_TOKEN"
      - name: Deploy production
        run: pnpm dlx vercel@59.1.3 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
      - name: Smoke test
        run: |
          login_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --retry 5 --retry-delay 3 "https://jastipin-cms.vercel.app/login")"
          auth_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --retry 5 --retry-delay 3 "https://jastipin-cms.vercel.app/api/v1/auth/me")"
          test "$login_status" = "200"
          test "$auth_status" = "401"
