name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
      APP_URL: ${{ secrets.APP_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: prammmoes-projects
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test
      - name: Apply production migrations
        run: pnpm db:migrate:production
      - name: Verify Vercel project access
        run: |
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID")"
          if [ "$status" != "200" ]; then
            echo "Vercel project access failed with HTTP $status. Check VERCEL_TOKEN scope, VERCEL_ORG_ID, and VERCEL_PROJECT_ID."
            exit 1
          fi
      - name: Configure production Vercel project link
        run: |
          mkdir -p .vercel
          jq -n \
            --arg orgId "$VERCEL_ORG_ID" \
            --arg projectId "$VERCEL_PROJECT_ID" \
            '{orgId: $orgId, projectId: $projectId}' \
            > .vercel/project.json
      - name: Sync production runtime secrets to Vercel Production
        run: |
          sync_secret() {
            local name="$1"
            local value="$2"
            pnpm dlx vercel@59.1.3 env rm "$name" production --yes --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN" || true
            printf '%s' "$value" | pnpm dlx vercel@59.1.3 env add "$name" production --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"
          }
          sync_secret APP_URL "$APP_URL"
          sync_secret CLOUDFLARE_ACCOUNT_ID "$CLOUDFLARE_ACCOUNT_ID"
          sync_secret CLOUDFLARE_D1_DATABASE_ID "$CLOUDFLARE_D1_DATABASE_ID"
          sync_secret CLOUDFLARE_D1_API_TOKEN "$CLOUDFLARE_D1_API_TOKEN"
      - name: Pull production project settings
        run: pnpm dlx vercel@59.1.3 pull --yes --environment=production --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"
      - name: Build production
        run: pnpm dlx vercel@59.1.3 build --prod --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"
      - name: Deploy production
        run: pnpm dlx vercel@59.1.3 deploy --prebuilt --prod --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"
      - name: Smoke test
        run: |
          login_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --retry 5 --retry-delay 3 "https://jastipin-cms.vercel.app/login")"
          auth_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --retry 5 --retry-delay 3 "https://jastipin-cms.vercel.app/api/v1/auth/me")"
          test "$login_status" = "200"
          test "$auth_status" = "401"
