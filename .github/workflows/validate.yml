name: Validate

on:
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_URL: http://localhost:3000
      CLOUDFLARE_ACCOUNT_ID: ci-account
      CLOUDFLARE_D1_DATABASE_ID: 79cdf032-1daa-48c2-8143-5a6979484bc5
      CLOUDFLARE_D1_API_TOKEN: ci-token
      AUTH_SESSION_COOKIE_NAME: jastipin_session
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
